services:
  soulseek-queue:
    build: .
    container_name: soulseek-queue
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:8090"
    environment:
      SLSKD_URL: ${SLSKD_URL:-http://slskd:5030}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      SEARCH_SECONDS: ${SEARCH_SECONDS:-30}
      RETRY_SECONDS: ${RETRY_SECONDS:-90}
      CONCURRENCY: ${CONCURRENCY:-3}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-25}
      RETRY_MATCH_THRESHOLD: ${RETRY_MATCH_THRESHOLD:-15}
      DOWNLOAD_STALL_SECONDS: ${DOWNLOAD_STALL_SECONDS:-5}
      DOWNLOAD_MAX_RETRIES: ${DOWNLOAD_MAX_RETRIES:-5}
      RETRY_ENABLED: ${RETRY_ENABLED:-true}
      BURST_SEARCHES: ${BURST_SEARCHES:-false}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      LASTFM_USERNAME: ${LASTFM_USERNAME:-}
      LASTFM_PROXY_URL: ${LASTFM_PROXY_URL:-}
      SLSKD_DOWNLOADS_PATH: ${SLSKD_DOWNLOADS_PATH:-/downloads}
      DOWNLOAD_DESTINATION_PATH: ${DOWNLOAD_DESTINATION_PATH:-/playlists}
      NAVIDROME_MUSIC_PATH: ${NAVIDROME_MUSIC_PATH:-/playlists}
      NAVIDROME_PLAYLIST_PATH: ${NAVIDROME_PLAYLIST_PATH:-/playlists}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USERNAME: ${NAVIDROME_USERNAME:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
    volumes:
      - soulseek_queue_data:/data
      - ${SLSKD_DOWNLOADS_HOST_PATH:-/srv/soulseek/downloads}:/downloads
      - ${PLAYLISTS_HOST_PATH:-/srv/soulseek/playlists}:/playlists
    # Put this service on the same Docker network as slskd, or set SLSKD_URL
    # to a host-reachable address such as http://host.docker.internal:5030.
volumes:
  soulseek_queue_data:

