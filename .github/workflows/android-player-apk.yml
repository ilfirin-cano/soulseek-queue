name: Android player APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-player/**"
      - ".github/workflows/android-player-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: :app:assembleDebug
          build-root-directory: android-player
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soulseek-player-debug-apk
          path: android-player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
